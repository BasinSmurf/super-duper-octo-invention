name: ci

# SPaaS validation only. Customer deployment infrastructure is configured separately.
on:
  pull_request:
  push:
    branches: [codex/customer-buildouts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Schema generation and mocked tests only; never a customer database.
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/spaas_validation
      DOTENV_CONFIG_PATH: /dev/null
      REDIS_URL: ''
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client without connecting to a database
        run: npx --no-install prisma generate
      - name: Build backend and copy runtime assets
        run: npm run build
      - name: Run backend regression tests
        env:
          NODE_ENV: test
        run: npm test -- --maxWorkers=2

  client:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Run frontend regression tests
        run: node --test
      - name: Build frontend and PWA
        run: npm run build
